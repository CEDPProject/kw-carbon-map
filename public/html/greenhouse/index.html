  <script src="/common.js"></script>

  <!--
    프론트엔드 번들러가 없으므로 bare specifier 'maplibre-gl' 을
    브라우저가 직접 해석할 수 있도록 import map 으로 매핑한다.
    dist 배치를 유지했기 때문에 shared/worker 는 상대경로로 자동 해석된다.
  -->
  <script type="importmap">
    {
      "imports": {
        "maplibre-gl": "/lib/maplibre/maplibre-gl.mjs"
      }
    }
  </script>
  <script type="module" src="/greenhouse/main.js"></script>

  <script type="text/javascript">
    $(document).ready(function () {
      const formatDate = () => {
        const date = new Date()
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0'); // 0부터 시작하므로 +1
        const day = String(date.getDate()).padStart(2, '0');
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');

        return `${year}년 ${month}월 ${day}일 ${hours}:${minutes}`;
      };

      $("#header_time").html(formatDate())
    })
  </script>
</head>

<body>

  <div class="body_wrap">
